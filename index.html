<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美团商家券查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;min-height:100vh}
.header{background:linear-gradient(135deg,#FF6B35,#FF8C42);padding:20px;text-align:center;color:#fff}
.logo{font-size:28px;font-weight:bold;margin-bottom:4px}
.slogan{font-size:13px;opacity:0.9}
.main{padding:15px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.card-title{font-size:16px;font-weight:bold;color:#333;margin-bottom:12px}
textarea{width:100%;height:100px;border:1px solid #e8e8e8;border-radius:8px;padding:12px;font-size:14px;resize:vertical;outline:none;background:#fafafa}
textarea:focus{border-color:#FF6B35}
.btn{width:100%;height:48px;background:linear-gradient(135deg,#FF6B35,#FF8C42);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:12px}
.btn:active{opacity:0.85}
.result{margin-top:15px;padding:16px;background:#f9f9f9;border-radius:8px;border-left:4px solid #FF6B35;display:none}
.result a{color:#FF6B35;text-decoration:none;font-weight:bold;display:block;padding:10px 0;border-bottom:1px dashed #eee;font-size:15px}
.result a:last-of-type{border-bottom:none}
.result.error{background:#fff0f0;border-left-color:#e74c3c;color:#e74c3c}
.tips{text-align:center;font-size:12px;color:#bbb;margin-top:12px}
.copy-btn{display:block;width:100%;margin-top:6px;padding:8px;background:#fff;color:#FF6B35;border:1px solid #FF6B35;border-radius:6px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="logo">🎫 美团商家券查询</div>
<div class="slogan">粘贴店铺链接，自动查隐藏券</div>
</div>
<div class="main">
<div class="card">
<div class="card-title">📎 粘贴链接</div>
<textarea id="input" placeholder="粘贴带店铺链接的分享文案即可"></textarea>
<button class="btn" onclick="search()">🔍 立即查询</button>
</div>
<div id="result" class="result"></div>
<div class="tips">两个领券入口任选，每日合计可领5张商家券</div>
</div>
<script>
var API='https://1446882229-dbqcldfaez.ap-guangzhou.tencentscf.com';

// 检测微信内置浏览器
function isWechat(){
  return /micromessenger/i.test(navigator.userAgent.toLowerCase());
}

function copyLink(url){
  navigator.clipboard.writeText(url).then(function(){
    alert('链接已复制到剪贴板');
  }).catch(function(){
    alert('复制失败，请长按链接手动复制');
  });
}

function search(){
  var raw = document.getElementById('input').value.trim();
  var r = document.getElementById('result');
  r.innerHTML = '';
  if(!raw){ r.style.display='block'; r.className='result error'; r.innerHTML='请粘贴内容'; return; }
  
  r.style.display='block'; r.className='result'; r.innerHTML='<p style="color:#666">⏳ 正在查询，请稍候...</p>';
  
  var cb = 'jsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  var timer = setTimeout(function(){
    delete window[cb];
    r.className='result error';
    r.innerHTML='查询超时，请重试';
  }, 15000);
  
  window[cb] = function(data){
    clearTimeout(timer);
    delete window[cb];
    if(data.error){
      r.className='result error';
      let errorText = data.error;
      // 仅解析失败 + 微信环境，才追加浏览器引导
      if(isWechat()){
        errorText += '<br><br>由于微信限制，请点击右上角「…」选择在浏览器中尝试';
      }
      r.innerHTML = errorText;
    } else {
      // 解析成功：完全无引导提示，原样展示两个领券入口
      r.className='result';
      r.innerHTML = '<p style="font-weight:bold;color:#333;margin-bottom:8px">🎫 商家券已找到！</p>' +
        '<a href="'+data.v8+'" target="_blank">👉 领取通道1（v8版）</a>' +
        '<button class="copy-btn" onclick="copyLink(\''+data.v8+'\')">📋 复制链接</button>' +
        '<a href="'+data.v6+'" target="_blank" style="margin-top:10px">👉 领取通道2（v6备用）</a>' +
        '<button class="copy-btn" onclick="copyLink(\''+data.v6+'\')">📋 复制链接</button>';
    }
  };
  
  var s = document.createElement('script');
  // 传完整粘贴内容，后端自动提取链接+店名兜底
  s.src = API+'?url='+encodeURIComponent(raw)+'&callback='+cb;
  s.onerror = function(){
    clearTimeout(timer);
    delete window[cb];
    r.className='result error';
    let errMsg = '请求失败，请重试';
    if(isWechat()){
      errMsg += '<br><br>由于微信限制，请点击右上角「…」选择在浏览器中尝试';
    }
    r.innerHTML = errMsg;
  };
  document.body.appendChild(s);
}
</script>
</body>
</html>
