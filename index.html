<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美团商家券查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;min-height:100vh}
.header{background:linear-gradient(135deg,#FF6B35,#FF8C42);padding:20px;text-align:center;color:#fff}
.logo{font-size:28px;font-weight:bold;margin-bottom:4px}
.slogan{font-size:13px;opacity:0.9}
.main{padding:15px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.card-title{font-size:16px;font-weight:bold;color:#333;margin-bottom:12px}
textarea{width:100%;height:100px;border:1px solid #e8e8e8;border-radius:8px;padding:12px;font-size:14px;resize:vertical;outline:none;background:#fafafa}
textarea:focus{border-color:#FF6B35}
.btn{width:100%;height:48px;background:linear-gradient(135deg,#FF6B35,#FF8C42);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:12px}
.btn:active{opacity:0.85}
.result{margin-top:15px;padding:16px;background:#f9f9f9;border-radius:8px;border-left:4px solid #FF6B35;display:none}
.result a{color:#FF6B35;text-decoration:none;font-weight:bold;display:block;padding:10px 0;border-bottom:1px dashed #eee;font-size:15px}
.result a:last-child{border-bottom:none}
.result.error{background:#fff0f0;border-left-color:#e74c3c;color:#e74c3c}
.tips{text-align:center;font-size:12px;color:#bbb;margin-top:12px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🎫 美团商家券查询</div>
<div class="slogan">粘贴店铺链接，自动查隐藏券</div>
</div>
<div class="main">
<div class="card">
<div class="card-title">📎 粘贴链接</div>
<textarea id="input" placeholder="粘贴文字或链接均可"></textarea>
<button class="btn" onclick="search()">🔍 立即查询</button>
</div>
<div id="result" class="result"></div>
<div class="tips">两个入口任选，每天共可领5张券</div>
</div>
<script>
var API='https://1446882229-dbqcldfaez.ap-guangzhou.tencentscf.com';

function extractUrl(t){
  var m = t.match(/https?:\/\/\S+/);
  return m ? m[0] : null;
}

function search(){
var raw=document.getElementById('input').value.trim();
var r=document.getElementById('result');
if(!raw){r.style.display='block';r.className='result error';r.innerHTML='请粘贴内容';return}
var url=extractUrl(raw);
if(!url){r.style.display='block';r.className='result error';r.innerHTML='未找到有效链接';return}
r.style.display='none';
var cb='jsonp_'+Date.now();
window[cb]=function(d){
delete window[cb];r.style.display='block';
if(d.error){r.className='result error';r.innerHTML=d.error}
else{r.className='result';r.innerHTML='<p style="font-weight:bold;color:#333;margin-bottom:8px">🎫 商家券已找到！</p><a href="'+d.v8+'" target="_blank">👉 入口1（v8版）</a><a href="'+d.v6+'" target="_blank">👉 入口2（v6备用）</a>'}
};
var s=document.createElement('script');
s.src=API+'?url='+encodeURIComponent(url)+'&callback='+cb;
s.onerror=function(){r.style.display='block';r.className='result error';r.innerHTML='查询失败，请重试';delete window[cb]};
document.body.appendChild(s)
}
</script>
</body>
</html>
