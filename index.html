<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美团商家券查询</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;min-height:100vh}
.header{background:linear-gradient(135deg,#FF6B35,#FF8C42);padding:20px;text-align:center;color:#fff}
.logo{font-size:28px;font-weight:bold;margin-bottom:4px}
.slogan{font-size:13px;opacity:0.9}
.main{padding:15px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.card-title{font-size:16px;font-weight:bold;color:#333;margin-bottom:12px}
textarea{width:100%;height:100px;border:1px solid #e8e8e8;border-radius:8px;padding:12px;font-size:14px;resize:vertical;outline:none;background:#fafafa}
textarea:focus{border-color:#FF6B35}
.btn{width:100%;height:48px;background:linear-gradient(135deg,#FF6B35,#FF8C42);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:12px}
.btn:active{opacity:0.85}
.result{margin-top:15px;padding:16px;background:#f9f9f9;border-radius:8px;border-left:4px solid #FF6B35;display:none}
.result a{color:#FF6B35;text-decoration:none;font-weight:bold;display:block;padding:10px 0;border-bottom:1px dashed #eee;font-size:15px}
.result a:last-child{border-bottom:none}
.result.error{background:#fff0f0;border-left-color:#e74c3c;color:#e74c3c}
.tips{text-align:center;font-size:12px;color:#bbb;margin-top:12px}
.shortTool{background:#fff;padding:14px;border-radius:10px;margin-bottom:14px}
.shortInput{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:8px}
.shortBtn{padding:8px 16px;background:#FF6B35;color:#fff;border:none;border-radius:6px}
.descTip{font-size:12px;color:#999;margin-top:6px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🎫 美团商家券查询</div>
<div class="slogan">粘贴店铺链接，自动查隐藏券</div>
</div>
<div class="main">
<div class="shortTool">
<div class="card-title">🔗 短链本地展开兜底工具</div>
<input class="shortInput" id="shortInput" placeholder="粘贴dpur1.cn等小众短链">
<button class="shortBtn" onclick="localExpandShort()">一键展开填入查询框</button>
<p class="descTip">浏览器本地网络解析，规避云函数外网拦截限制</p>
</div>
<div class="card">
<div class="card-title">📎 粘贴链接</div>
<textarea id="contentInput" placeholder="粘贴带店铺链接的文字即可"></textarea>
<button class="btn" onclick="startSearch()">🔍 立即查询</button>
</div>
<div id="resultBox" class="result"></div>
<div class="tips">两个领券入口任选，每日合计可领5张商家券</div>
</div>
<script>
const API_URL = 'https://1446882229-dbqcldfaez.ap-guangzhou.tencentscf.com';
const REQUEST_TIMEOUT = 10000;

async function localExpandShort() {
    const shortVal = document.getElementById('shortInput').value.trim();
    if (!shortVal) return alert('请输入短链地址');
    try {
        const resp = await fetch(shortVal, { redirect: 'follow' });
        const realUrl = resp.url;
        document.getElementById('contentInput').value = realUrl;
        alert('展开完成！真实店铺链接已自动填入上方输入框，直接点击查询即可');
    } catch (err) {
        alert('本地展开失败，请复制短链到手机系统浏览器打开，复制页面地址再粘贴');
    }
}

function getPureLink(text) {
    const matchResult = text.match(/https?:\/\/\S+/);
    if (!matchResult) return null;
    // 已修正：移除多余中文顿号，防止误伤URL参数
    return matchResult[0].replace(/[。，！？；：,.;:!?]+$/, '');
}

function startSearch() {
    const inputText = document.getElementById('contentInput').value.trim();
    const resultDom = document.getElementById('resultBox');
    let timerId = null;
    resultDom.innerHTML = '';
    if (!inputText) {
        resultDom.style.display = 'block';
        resultDom.className = 'result error';
        resultDom.innerHTML = '请粘贴包含店铺链接的内容';
        return;
    }
    const targetUrl = getPureLink(inputText);
    if (!targetUrl) {
        resultDom.style.display = 'block';
        resultDom.className = 'result error';
        resultDom.innerHTML = '未识别到有效网页链接';
        return;
    }
    if (targetUrl.length > 2048) {
        resultDom.style.display = 'block';
        resultDom.className = 'result error';
        resultDom.innerHTML = '链接长度超限，请重新复制';
        return;
    }
    resultDom.style.display = 'block';
    resultDom.className = 'result';
    resultDom.innerHTML = '<p style="color:#666">⏳ 正在解析店铺信息，请稍候...</p>';
    const callbackName = 'jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    timerId = setTimeout(() => {
        delete window[callbackName];
        resultDom.className = 'result error';
        resultDom.innerHTML = '请求超时，小众短链请使用上方短链展开工具';
    }, REQUEST_TIMEOUT);
    window[callbackName] = function (resData) {
        clearTimeout(timerId);
        delete window[callbackName];
        if (resData.error) {
            resultDom.className = 'result error';
            resultDom.innerHTML = resData.error + '<br><small>提示：dpur1.cn类短链请使用顶部本地展开工具</small>';
        } else {
            resultDom.className = 'result';
            resultDom.innerHTML = `
                <p style="font-weight:bold;color:#333;margin-bottom:8px">🎫 商家券已找到！</p>
                <a href="${resData.v8}" target="_blank">👉 领取通道1（v8标准版）</a>
                <a href="${resData.v6}" target="_blank">👉 领取通道2（v6备用版）</a>
            `;
        }
    };
    const scriptTag = document.createElement('script');
    scriptTag.src = `${API_URL}?url=${encodeURIComponent(targetUrl)}&callback=${callbackName}`;
    scriptTag.onerror = function () {
        clearTimeout(timerId);
        delete window[callbackName];
        resultDom.className = 'result error';
        resultDom.innerHTML = '接口请求失败，请使用上方短链本地展开工具';
    };
    document.body.appendChild(scriptTag);
}
</script>
</body>
</html>
